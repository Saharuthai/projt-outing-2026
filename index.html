<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html{--tx:#1b1b1f}
body{margin:0;font-family:'Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif;background:linear-gradient(180deg,#fff7ec,#ffe9d2);color:var(--tx);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
img{display:block;max-width:100%}
.hero{position:relative;color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;background:#161a45;overflow:hidden}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 80%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,20,56,.88),rgba(18,20,56,.55) 60%,rgba(18,20,56,.75))}
.hero .in{position:relative}
.eyebrow{font-weight:700;letter-spacing:2px;color:#ffd9a0;font-size:13px}
h1{margin:0;font-size:38px;line-height:1.05;font-weight:800}
.place{font-size:20px;font-weight:700;margin-top:4px}
.date{display:inline-block;margin-top:8px;background:#fff;color:#8c1d18;font-weight:800;font-size:15px;padding:3px 14px;border-radius:99px}
.team{margin-top:14px;background:rgba(255,255,255,.96);color:#1b1b1f;border-radius:14px;padding:10px 14px}
.team b{display:block;color:#b3261e;font-size:19px;line-height:1.3}
.team .n{color:#24406e;font-weight:700}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.route span{background:#24406e;color:#fff;font-size:12.5px;font-weight:700;padding:1px 10px;border-radius:99px}
.lang{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 12px);z-index:3;border:0;background:rgba(255,255,255,.95);color:#24406e;font:700 14px 'Noto Sans Thai',sans-serif;padding:6px 14px;border-radius:99px;min-height:36px}
.tabs{position:sticky;top:0;z-index:10;display:flex;gap:6px;overflow-x:auto;padding:8px 10px calc(8px);background:rgba(255,247,236,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,.1);scrollbar-width:none;padding-top:calc(env(safe-area-inset-top)*0 + 8px)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-width:54px;border:0;border-radius:12px;background:#fff;color:#33333b;padding:5px 10px;font:600 13px/1.25 'Noto Sans Thai',sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tab b{display:block;font-size:17px;font-weight:800}
.tab.on{color:#fff}
.tab .td{display:block;font-size:10.5px;font-weight:700;color:#e0613f}
.tab.on .td{color:#fff}
main{padding:12px 12px 8px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.12);overflow:hidden;margin-bottom:12px}
.dh{color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.dh .ic{width:40px;height:40px;filter:brightness(0) invert(1);flex:none}
.dh .d1{font-size:26px;font-weight:800;line-height:1.15}
.dh .d2{font-size:14px;font-weight:500;opacity:.95}
.ttl{padding:12px 16px 4px;font-size:20px;font-weight:800;line-height:1.35;color:var(--dc)}
.ph{display:grid;gap:6px;padding:6px 10px 0}
.ph.two{grid-template-columns:1fr 1fr}
.ph img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:10px}
.ph.one img{aspect-ratio:16/10}
.rows{padding:8px 14px 12px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:10px;padding:8px 6px;border-radius:10px;align-items:flex-start}
.row .tm{color:var(--dc);flex:none;width:92px;font-weight:700;font-size:14.5px;line-height:1.45}
.row .tx{flex:1;font-size:15.5px;line-height:1.5}
.row .tx img{display:inline-block;width:22px;height:22px;vertical-align:-4px;margin-right:6px}
.row.hi{background:#fdecea}
.row.hi .tm{color:#9b1c14}
.row.hi .tx{font-weight:700;color:#7a120c}
.dress{margin:4px 12px 14px;background:#f6f1ea;border-radius:12px;padding:10px 12px}
.dress h4{margin:0 0 6px;font-size:13px;color:#5a4a3a;font-weight:700}
.dress .im{display:grid;gap:8px;grid-template-columns:1fr}
.dress .im img{width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#fff;border-radius:8px}
.dress .li{margin-top:8px}
.dress .li b{display:block;font-size:15.5px;font-weight:800;line-height:1.35}
.dress .li span{display:block;font-size:13.5px;color:#33333b;line-height:1.45}
.box{margin:8px 14px;border-radius:12px;padding:12px 14px;background:#e3f4f1;font-size:15px;line-height:1.55}
.box.c{text-align:center;font-size:17px;font-weight:700;color:#0b4f46}
.box.c img{width:56px;height:56px;margin:0 auto 6px}
.box.w{background:#fff;border:1px solid #cfe9e4}
.box h5{margin:0 0 4px;font-size:15px;color:#00796b;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:14px;border-radius:99px;padding:3px 14px 3px 8px}
.pill img{width:22px;height:22px;filter:brightness(0) invert(1)}
.sc{padding:14px 16px}
.sc .pill{margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #f0e6da;font-size:15px}
.kv:first-of-type{border-top:0}
.kv b{flex:none}
.kv span{text-align:right}
.mp .kv{justify-content:flex-start}
.mp .kv b{width:112px;color:#b3261e}
.mp .kv span{text-align:left}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.big div{border-radius:12px;padding:10px;text-align:center;font-size:14px}
.big div b{display:block;font-size:24px;font-weight:800;line-height:1.3}
.bg1 div{background:#fff3e6}.bg1 b{color:#a8520a}
.bg2 div{background:#e8f1fb}.bg2 b{color:#1565a8}
.note{font-size:13.5px;color:#33333b;line-height:1.5}
.ck{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:none;-webkit-appearance:none;appearance:none;color:var(--tx);-webkit-text-fill-color:var(--tx);text-align:left;font:inherit;font-size:15.5px;padding:9px 2px;border-top:1px solid #f0e6da;min-height:44px}
.ck:first-of-type{border-top:0}
.ck i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #1b7f4b;margin-top:1px;position:relative}
.ck.on i{background:#1b7f4b}
.ck.on i:after{content:'';position:absolute;left:6px;top:2px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.ck span{color:var(--tx);-webkit-text-fill-color:var(--tx);flex:1}
.ck.on span{color:#7a7a82;-webkit-text-fill-color:#7a7a82;}
.ban{display:grid;gap:8px}
.ban div{font-size:14.5px;line-height:1.5}
.hotelimg{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-top:8px}
.foot{text-align:center;padding:6px 16px calc(24px + env(safe-area-inset-bottom));font-size:12px;color:#55555f}
.foot img{height:44px;margin:0 auto 6px}
.nav{display:flex;gap:10px;margin:0 0 12px}
.nav button{flex:1;border:0;border-radius:12px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.14);padding:12px;font:700 15px 'Noto Sans Thai',sans-serif;color:#24406e;min-height:48px}
.nav button:disabled{opacity:.35}
.fl{margin:6px 14px 2px;border-radius:12px;background:#eef2fb;border-left:5px solid var(--dc);padding:8px 12px}
.fl h6{margin:0 0 4px;font-size:12.5px;font-weight:800;letter-spacing:.3px;color:var(--dc);display:flex;align-items:center;gap:6px}
.fl h6 img{width:16px;height:16px}
.fl .f{padding:5px 0;border-top:1px solid rgba(0,0,0,.08);font-size:14.5px;line-height:1.45}
.fl .f:first-of-type{border-top:0}
.fl .f .t{display:block;font-weight:700}
.fl.no{background:#f4f1ec;border-left-color:#c9c2b8;color:#6b6760;font-size:14px}
.hid{display:none}
#theme{right:78px;font-size:16px;padding:6px 12px}
html.dark{--tx:#eceaf2;color-scheme:dark}
html.dark .tabs{background:rgba(20,19,31,.96);box-shadow:0 2px 10px rgba(0,0,0,.5)}
html.dark .tab{background:#2a2740;color:#e6e3ef;box-shadow:none}
html.dark .tab.on{color:#fff}
html.dark .tab .td{color:#ffa07a}
html.dark .tab.on .td{color:#fff}
html.dark .card{background:#221f33;box-shadow:0 2px 12px rgba(0,0,0,.45)}
html.dark .ttl,html.dark .row .tm{color:var(--dcl)}
html.dark .row.hi{background:#3b2028}
html.dark .row.hi .tm{color:#ff9a90}
html.dark .row.hi .tx{color:#ffc9c3}
html.dark .row .tx img{filter:brightness(1.3) saturate(1.1)}
html.dark .dress{background:#2b2840}
html.dark .dress h4{color:#d9c9b5}
html.dark .dress .li span,html.dark .note{color:#c4c0d1}
html.dark .box{background:#1f3a37;color:#d6f1ec}
html.dark .box.c{color:#8de0d2}
html.dark .box.w{background:#26233a;border-color:#2f5a55;color:var(--tx)}
html.dark .box h5{color:#4fd1bf}
html.dark .kv,html.dark .ck{border-top-color:#37334d}
html.dark .mp .kv b{color:#ff8a80}
html.dark .bg1 div{background:#3a2d22}html.dark .bg1 b{color:#ffb26b}
html.dark .bg2 div{background:#22324a}html.dark .bg2 b{color:#6fb4f2}
html.dark .ck i{border-color:#4fd18a}
html.dark .ck.on i{background:#2fa66a}
html.dark .ck.on span{color:#8a869a;-webkit-text-fill-color:#8a869a}
html.dark .nav button{background:#2a2740;color:#a9c0ff;box-shadow:none}
html.dark .fl{background:#2a2e4a}
html.dark .fl .f{border-top-color:rgba(255,255,255,.12)}
html.dark .fl h6{color:var(--dcl)}
html.dark .fl.no{background:#26233a;color:#a9a5b8}
html.dark .foot{color:#a9a5b8}
html.dark .lang{background:rgba(35,32,52,.95);color:#e6e3ef}

/* animation */
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-3px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(224,97,63,.0)}50%{box-shadow:0 0 0 6px rgba(224,97,63,.14)}}
@keyframes outl{to{opacity:0;transform:translate3d(-28px,0,0)}}
@keyframes outr{to{opacity:0;transform:translate3d(28px,0,0)}}
@keyframes inl{from{opacity:0;transform:translate3d(40px,0,0)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:0;transform:translate3d(-40px,0,0)}to{opacity:1;transform:none}}
@keyframes planefly{0%{transform:translateX(0) rotate(45deg);opacity:0}8%{opacity:1}80%{transform:translateX(var(--fw,120px)) rotate(45deg);opacity:1}92%,100%{transform:translateX(var(--fw,120px)) rotate(45deg);opacity:0}}
@keyframes trail{0%{transform:scaleX(0);opacity:1}80%{transform:scaleX(1);opacity:1}92%,100%{transform:scaleX(1);opacity:0}}
@keyframes tick{0%{transform:rotate(45deg) scale(0)}60%{transform:rotate(45deg) scale(1.3)}100%{transform:rotate(45deg) scale(1)}}
@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(1.9);opacity:0}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
body{overflow-x:clip}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#14131f,#1c1a2c);opacity:0;transition:opacity .45s ease}
html.dark body:before{opacity:1}
.hero .pbg{position:absolute;inset:0;will-change:transform}
.hero .bg{animation:kb 26s ease-in-out infinite alternate}
.hero .in{will-change:transform,opacity}
.hero .in>*{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.hero .in>:nth-child(2){animation-delay:.08s}.hero .in>:nth-child(3){animation-delay:.16s}.hero .in>:nth-child(4){animation-delay:.24s}.hero .in>:nth-child(5){animation-delay:.34s}
.tabs{animation:up .5s .2s both;transition:background-color .3s,backdrop-filter .3s,-webkit-backdrop-filter .3s}
.tabs.stuck{background:rgba(255,247,236,.78);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
html.dark .tabs.stuck{background:rgba(20,19,31,.74)}
.tsh{position:sticky;top:0;height:0;z-index:9;pointer-events:none}
.tsh:before{content:'';position:absolute;left:0;right:0;top:var(--th,60px);height:18px;background:linear-gradient(rgba(0,0,0,.2),transparent);opacity:0;transition:opacity .3s}
.tsh.on:before{opacity:1}
.tab{position:relative;z-index:1;transition:transform .12s,color .28s .08s,background-color .2s}
.tab.on,html.dark .tab.on{background:transparent;box-shadow:none}
.ind{position:absolute;left:0;top:0;z-index:0;pointer-events:none;transform-origin:0 0;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.22);will-change:transform;transition:transform .42s cubic-bezier(.3,.85,.25,1),background-color .3s}
.ind.nt{transition:none}
.tab:active,.nav button:active,.lang:active{transform:scale(.95)}
.nav button,.lang{transition:transform .12s}
main.out-l{animation:outl .15s ease-in forwards}
main.out-r{animation:outr .15s ease-in forwards}
main.in-l{animation:inl .4s cubic-bezier(.2,.8,.2,1) both}
main.in-r{animation:inr .4s cubic-bezier(.2,.8,.2,1) both}
.rv{opacity:0;transform:translate3d(0,18px,0);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.rv.vis{opacity:1;transform:none}
.row.hi{animation:glow 3s 1.2s ease-in-out infinite}
.row.hi .tx>img{animation:fly 2.4s ease-in-out infinite}
.dh .ic{animation:bob 3.2s ease-in-out infinite}
.fl h6 img{animation:fly 2.4s ease-in-out infinite}
.foot img{transform-origin:50% 0;animation:sway 3.6s ease-in-out infinite}
/* timeline */
.rows{position:relative}
.rows:before,.rows:after{content:'';position:absolute;left:8.5px;width:2px;top:var(--lt,0px);height:var(--lh,0px);border-radius:2px}
.rows:before{background:rgba(0,0,0,.1)}
html.dark .rows:before{background:rgba(255,255,255,.14)}
.rows:after{background:var(--dc);transform-origin:50% 0;transform:scaleY(var(--p,0));will-change:transform}
html.dark .rows:after{background:var(--dcl)}
.row{position:relative}
.row:before{content:'';position:absolute;left:-9px;top:14.5px;width:9px;height:9px;border-radius:50%;border:2px solid var(--dc);background:var(--cbg,#fff);transition:background-color .3s,transform .35s cubic-bezier(.3,1.6,.5,1)}
html.dark .row:before{border-color:var(--dcl)}
.row.rc:before{background:var(--dc);transform:scale(1.2)}
html.dark .row.rc:before{background:var(--dcl)}
html{--cbg:#fff}html.dark{--cbg:#221f33}
/* flight path */
.fp{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.5px;color:#9b1c14}
html.dark .fp{color:#ff9a90}
.fp .trk{position:relative;flex:1;height:20px}
.fp .trk:before{content:'';position:absolute;left:0;right:0;top:50%;margin-top:-1px;border-top:2px dashed currentColor;opacity:.3}
.fp .tr{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:currentColor;opacity:.75;transform-origin:0 50%;transform:scaleX(0);animation:trail 3.6s cubic-bezier(.45,.05,.55,.95) infinite;animation-play-state:paused}
.row .tx .fp .trk img.pl{position:absolute;left:0;top:1px;width:18px;height:18px;margin:0;vertical-align:baseline;animation:planefly 3.6s cubic-bezier(.45,.05,.55,.95) infinite;animation-play-state:paused;opacity:0}
.row.vis .fp .tr,.row.vis .fp .pl{animation-play-state:running}
.fp .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;display:none}
/* place cards (Chinese name + pinyin + map links) */
.pcs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.box .pcs{margin-top:10px}
.pcw{display:flex;flex-direction:column;gap:8px;padding:8px 8px 8px 12px;border-radius:12px;background:rgba(36,64,110,.07);border:1px solid rgba(36,64,110,.18);font-weight:400}
.row.hi .pcw{background:rgba(155,28,20,.07);border-color:rgba(155,28,20,.2)}
.pcw .top{display:flex;align-items:center;gap:8px}
.pcw .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pcw .zh{font:700 16px/1.3 'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;color:var(--tx)}
.pcw .py{font-size:13px;line-height:1.3;color:#55555f;font-style:italic}
.cp{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(36,64,110,.25);background:#fff;color:#24406e;-webkit-text-fill-color:#24406e;border-radius:12px;font-size:18px;font-weight:800;padding:0;transition:transform .12s,background-color .2s}
.cp:active{transform:scale(.95)}
.cp.ok{background:#1b7f4b;color:#fff;-webkit-text-fill-color:#fff;border-color:#1b7f4b}
.pcw .btns{display:flex;flex-wrap:wrap;gap:8px;padding-right:0;align-items:stretch}
.sp{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:#24406e;color:#fff;-webkit-text-fill-color:#fff;padding:0;transition:transform .12s,background-color .2s}
.sp:active{transform:scale(.92)}
.sp .w1,.sp .w2{opacity:.55}
.sp.slow{background:#a8520a;font-size:22px;line-height:1}
.sp.on{background:#1b7f4b}
.sp.on .w1{animation:wv 1s ease-in-out infinite}
.sp.on .w2{animation:wv 1s .3s ease-in-out infinite}
html.dark .sp{background:#4a6fc9}
html.dark .sp.slow{background:#b4641a}
html.dark .sp.on{background:#2fa66a}
@keyframes wv{0%,100%{opacity:.25}50%{opacity:1}}
.ab{flex:1 1 72px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:4px 8px;border-radius:10px;font-weight:800;font-size:13px;line-height:1.2;text-decoration:none;transition:transform .12s}
.ab:active{transform:scale(.97)}
.ab.am{background:#24406e;color:#fff;-webkit-text-fill-color:#fff}
.ab.gm{background:#fff;color:#1a4fa0;-webkit-text-fill-color:#1a4fa0;border:1px solid rgba(26,79,160,.35)}
html.dark .pcw{background:rgba(143,176,255,.1);border-color:rgba(143,176,255,.25)}

function wgs2gcj(lat,lon){
 var a=6378245.0,ee=0.00669342162296594323;
 function tl(x,y){var r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r}
 function tn(x,y){var r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r}
 var dl=tl(lon-105,lat-35),dn=tn(lon-105,lat-35),rad=lat/180*Math.PI,m=Math.sin(rad);m=1-ee*m*m;var sm=Math.sqrt(m);
 dl=(dl*180)/((a*(1-ee))/(m*sm)*Math.PI);dn=(dn*180)/(a/sm*Math.cos(rad)*Math.PI);return [lat+dl,lon+dn]}

/* Google Maps: inside mainland China its map uses GCJ-02, so convert WGS84 first; else name search. */

 h+='<section class="card sc">'+pill('#1b7f4b','09-calendar',N.ck)+CK.map(function(c,i){return '<button class="ck'+(done[i]?' on':'')+'" data-ck="'+i+'"><i></i><span><em class="tt">'+esc(T(c))+'</em></span></button>'}).join('')+'</section>';
 h+='<section class="card sc">'+pill('#6a2c91','09-group',N.es)+
  '<div style="font-size:15.5px;line-height:1.6"><b>eSIM:</b> '+(P?'ทีมเตรียมให้ ใช้ E-SIM VACAY 5 วัน (10GB) ใช้ AI และ TikTok ได้ (ต้องตั้งค่า TikTok)':'Provided by the team: E-SIM VACAY, 5 days (10GB); AI and TikTok work (TikTok needs setup)')+
  '<br><b>'+(P?'ไฟฟ้า:':'Power:')+'</b> '+(P?'220V / 50Hz ปลั๊ก Type A, C, I · บริษัทเตรียม Adaptor ให้':'220V / 50Hz, plug Types A, C, I · the company provides adapters')+
  '<br><b>'+(P?'Agency ให้:':'From the agency:')+'</b> '+(P?'Tag PVC, Travel Kit คนละ 1 ชุด, ยา PARACETAMOL และ ENO คนละ 1 ชุด':'PVC bag tag, Travel Kit (1 each), PARACETAMOL and ENO (1 set each)')+'</div></section>';
 h+='<section class="card sc">'+pill('#8c1d18','09-meeting-pin',N.bn)+'<div class="ban">'+BAN.map(function(b){return '<div><b>'+esc(T(b[0]))+':</b> '+esc(T(b[1]))+'</div>'}).join('')+'</div></section>';
 h+='<div class="nav"><button data-i="5">'+T(UI.prev)+'</button><button data-i="0">'+(P?'กลับไปวันที่ 1':'Back to Day 1')+'</button></div>';
 return h;
}
var THEME='auto';try{var _tv=localStorage.getItem('woxa-theme');if(_tv==='dark'||_tv==='light')THEME=_tv}catch(e){}
function sysDark(){return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function isDark(){return THEME==='dark'||(THEME==='auto'&&sysDark())}
function applyTheme(){var d=isDark();document.documentElement.classList.toggle('dark',d);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#14131f':'#2a2060';var b=document.getElementById('theme');if(b)b.textContent=d?'☀️':'🌙'}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(THEME==='auto')applyTheme()})}catch(e){}
var RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
function mo(){return !(RM&&RM.matches)}
function renderChrome(){
 applyTheme();
 document.documentElement.lang=LANG;
 document.getElementById('lang').textContent=LANG==='th'?'EN':'ไทย';
 document.getElementById('place').textContent=T(UI.place);
 document.getElementById('mon').textContent=T(UI.mon);
 document.getElementById('teamName').textContent=T(UI.team);
 document.getElementById('teamN').textContent=T(UI.n);
 document.getElementById('src').textContent=T(UI.src);
}
var IO=null,TLS=[],stuck=false,heroH=0,ticking=false,swapTm=0;
var REV='.sc,.fl,.ph img,.row,.dress,.box,.nav';
function clamp(v){return v<0?0:v>1?1:v}
function layoutFlights(){[].forEach.call(document.querySelectorAll('.fp .trk'),function(t){t.style.setProperty('--fw',Math.max(20,t.clientWidth-18)+'px')})}
function layoutTL(){
 TLS=[];
 [].forEach.call(document.querySelectorAll('#main .rows'),function(el){
  var rs=[].slice.call(el.querySelectorAll('.row'));if(!rs.length)return;
  var ys=rs.map(function(r){return r.offsetTop+19}),lt=ys[0],lh=ys[ys.length-1]-lt;
  el.style.setProperty('--lt',lt+'px');el.style.setProperty('--lh',lh+'px');
  if(!mo()){el.style.setProperty('--p',1);rs.forEach(function(r){r.classList.add('rc')});return}
  TLS.push({el:el,lt:lt,lh:lh,p:-1,rows:rs.map(function(r,i){return{el:r,y:ys[i],on:null}})});
 });
 frame();
}
function layoutAll(){
 var h=document.getElementById('hero'),t=document.getElementById('tabs');
 heroH=h.offsetHeight;document.getElementById('tsh').style.setProperty('--th',t.offsetHeight+'px');
 placeInd(true);layoutFlights();layoutTL();
}
function countUp(el){
 var to=+el.getAttribute('data-to'),t0=0;
 function step(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/1000);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)}
 requestAnimationFrame(step);
}
function afterRender(){
 if(IO){IO.disconnect();IO=null}
 var m=document.getElementById('main');
 layoutFlights();layoutTL();
 if(!mo()||!('IntersectionObserver' in window))return;
 IO=new IntersectionObserver(function(es){
  var k=0;
  es.forEach(function(e){
   if(!e.isIntersecting)return;
   var el=e.target;IO.unobserve(el);
   if(el.classList.contains('cu')){countUp(el);return}
   el.style.transitionDelay=Math.min(k++,6)*55+'ms';el.classList.add('vis');
  });
 },{threshold:.08,rootMargin:'0px 0px -5% 0px'});
 [].forEach.call(m.querySelectorAll(REV),function(el){el.classList.add('rv');IO.observe(el)});
 [].forEach.call(m.querySelectorAll('.cu'),function(el){el.textContent='0';IO.observe(el)});
}
function renderMain(dir){
 var m=document.getElementById('main');
 m.innerHTML=cur===6?summaryHTML():dayHTML(cur);
 m.className='';
 if(dir&&mo()){void m.offsetWidth;m.className=dir>0?'in-l':'in-r';setTimeout(function(){if(m.className.indexOf('in-')===0)m.className=''},450)}
 afterRender();
}
function render(){renderChrome();renderTabs();renderMain(0);layoutAll()}
function go(i,scroll){
 if(i<0||i>6)return;
 var dir=i>cur?1:i<cur?-1:0,m=document.getElementById('main');
 cur=i;clearTimeout(swapTm);
 try{history.replaceState(null,'',i===6?'#summary':'#day'+(i+1))}catch(e){try{location.hash=i===6?'summary':'day'+(i+1)}catch(e2){}}
 renderTabs();
 if(scroll){var t=document.getElementById('tabs');window.scrollTo({top:heroH||t.offsetTop,behavior:mo()?'smooth':'auto'})}
 if(dir&&mo()){m.className=dir>0?'out-l':'out-r';swapTm=setTimeout(function(){renderMain(dir)},150)}
 else renderMain(dir);
}
function onScroll(){if(!ticking){ticking=true;requestAnimationFrame(frame)}}
function frame(){
 ticking=false;
 var y=Math.max(0,window.pageYOffset||0),pb=document.getElementById('pbg'),hin=document.getElementById('hin');
 if(mo()&&y<heroH+100){
  pb.style.transform='translate3d(0,'+(y*.3).toFixed(1)+'px,0)';
  hin.style.transform='translate3d(0,'+(y*.12).toFixed(1)+'px,0)';
  hin.style.opacity=(1-Math.min(1,y/(heroH||1))*.5).toFixed(2);
 }
 var st=y>=heroH-1&&heroH>0;
 if(st!==stuck){stuck=st;document.getElementById('tabs').classList.toggle('stuck',st);document.getElementById('tsh').classList.toggle('on',st)}
 var ty=window.innerHeight*.7;
 TLS.forEach(function(T){
  var r=T.el.getBoundingClientRect();
  if(r.bottom<-60||r.top>window.innerHeight+60)return;
  var p=T.lh>0?clamp((ty-(r.top+T.lt))/T.lh):0;
  if(Math.abs(p-T.p)>.002){T.p=p;T.el.style.setProperty('--p',p.toFixed(3))}
  T.rows.forEach(function(o){var on=ty>=r.top+o.y;if(on!==o.on){o.on=on;o.el.classList.toggle('rc',on)}});
 });
}
function haptic(){
 try{if(navigator.vibrate){navigator.vibrate(12);return}}catch(e){}
 try{var l=document.getElementById('hapl');if(l)l.click()}catch(e){}
}
var thTm=0;
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',function(){layoutAll()});
window.addEventListener('load',layoutAll);
try{document.fonts.ready.then(layoutAll)}catch(e){}
document.addEventListener('click',function(e){
 var spb=e.target.closest('.sp');
 if(spb){sayZh(spb.getAttribute('data-say'),spb,parseFloat(spb.getAttribute('data-rate'))||.85);return}
 var cpb=e.target.closest('.cp');
 if(cpb){copyText(cpb.getAttribute('data-cp'),cpb);return}
 var b=e.target.closest('[data-i]');
 if(b&&!b.disabled){go(+b.getAttribute('data-i'),true);return}
 var c=e.target.closest('[data-ck]');
 if(c){var k=c.getAttribute('data-ck');done[k]=!done[k];try{localStorage.setItem('woxa-ck',JSON.stringify(done))}catch(x){}
  c.classList.remove('pk');c.classList.toggle('on',!!done[k]);void c.offsetWidth;c.classList.add('pk');haptic();return}
 var th=e.target.closest('#theme');
 if(th){var root=document.documentElement;if(mo()){root.classList.add('theming');clearTimeout(thTm);thTm=setTimeout(function(){root.classList.remove('theming')},600);th.classList.remove('spin');void th.offsetWidth;th.classList.add('spin')}
  THEME=isDark()?'light':'dark';try{localStorage.setItem('woxa-theme',THEME)}catch(x){}applyTheme();return}
 if(e.target.closest('#lang')){LANG=LANG==='th'?'en':'th';try{localStorage.setItem('woxa-lang',LANG)}catch(x){}render()}
});
var sx=0,sy=0;
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){
 var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2.2&&!e.target.closest('#tabs')){go(cur+(dx<0?1:-1),true)}
},{passive:true});
function fromHash(){
 var h=(location.hash||'').replace('#','');
 if(h==='summary')return 6;
 var m=/^day([1-6])$/.exec(h);
 if(m)return +m[1]-1;
 return TD>=0?TD:0;
}
window.addEventListener('hashchange',function(){var i=fromHash();if(i!==cur){cur=i;renderTabs();renderMain(0)}});
cur=fromHash();render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}})}
</script>
